services:
  postgres:
    image: postgres:16
    container_name: python_backend_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: task_api
      POSTGRES_USER: task_api
      POSTGRES_PASSWORD: task_api
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: